<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino Control PRO</title>
    <style>
        :root {
            /* Paleta de colores Premium */
            --bg-body: #0a0e17;       /* Fondo ultra oscuro */
            --bg-card: #141a29;       /* Fondo tarjetas (ligeramente más claro) */
            --bg-input: #1f293a;      /* Fondo inputs */
            --accent: #f1e05a;        /* Amarillo corporativo */
            --accent-hover: #ffea75;  /* Amarillo al pasar el mouse */
            --text-main: #e6edf3;     /* Texto principal */
            --text-muted: #8b949e;   /* Texto secundario */
            --border: #2d364a;        /* Bordes suaves */
            --shadow-card: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -4px rgba(0, 0, 0, 0.2);
            --font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        * {
            box-sizing: border-box;
            transition: all 0.2s ease-in-out;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            line-height: 1.5;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* --- Estilos de Texto --- */
        h1 {
            font-size: 2rem;
            font-weight: 800;
            color: var(--accent);
            text-align: center;
            margin: 10px 0 30px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--text-main);
            border-bottom: 2px solid var(--accent);
            display: inline-block;
            padding-bottom: 5px;
        }

        /* --- Componentes Comunes --- */
        .card {
            background-color: var(--bg-card);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-card);
        }

        /* --- Pantalla de Login (Mejorada) --- */
        #login-screen {
            max-width: 420px;
            margin: auto;
            text-align: center;
            padding: 50px 30px;
        }

        #login-screen p {
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        #password-input {
            width: 100%;
            font-size: 1.2rem;
            letter-spacing: 4px;
            text-align: center;
            padding: 15px;
        }

        /* --- Formulario y Grid --- */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        input, select, textarea {
            padding: 12px 15px;
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-family: var(--font-family);
            font-size: 0.95rem;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(241, 224, 90, 0.1);
        }

        /* Estilo para los inputs de dinero */
        .input-money {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: var(--accent);
        }

        /* --- Botones --- */
        .btn-primary {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 14px 24px;
            font-weight: 700;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 25px;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: translateY(1px);
        }

        /* --- Tabla Premium --- */
        .table-container {
            overflow-x: auto;
            margin-top: 10px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            min-width: 800px; /* Asegura scroll en móviles */
        }

        th, td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: rgba(31, 41, 58, 0.4);
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        th:first-child { border-radius: 8px 0 0 0; }
        th:last-child { border-radius: 0 8px 0 0; }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: rgba(31, 41, 58, 0.2);
        }

        .col-fecha { color: var(--text-muted); font-size: 0.9rem; }
        .col-nombre { font-weight: 600; color: var(--text-main); }
        .col-money { font-family: 'Courier New', Courier, monospace; font-weight: bold; color: var(--accent); text-align: right; }
        .col-obs { color: var(--text-muted); font-size: 0.9rem; font-style: italic;}

        /* Clases de utilidad */
        .hidden { display: none !important; }
        .text-error { color: #ff6b6b; font-size: 0.9rem; margin-top: 10px; font-weight: 500;}

        /* Animación de entrada */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #main-panel:not(.hidden) {
            animation: fadeIn 0.4s ease-out forwards;
        }

    </style>
</head>
<body>

<div class="container">

    <!-- PANTALLA DE LOGIN -->
    <div id="login-screen" class="card">
        <h1>CASINO CONTROL<br><span style="font-size: 0.8rem; letter-spacing: 5px; color: var(--text-muted);">PRO SYSTEM</span></h1>
        <p>Sistema de Gestión de Operaciones Seguras</p>
        <div class="form-group">
            <label>PIN DE ACCESO</label>
            <input type="password" id="password-input" placeholder="****" maxlength="4">
            <p id="login-error" class="text-error hidden">⚠ PIN Incorrecto. Intente nuevamente.</p>
        </div>
        <button class="btn-primary" onclick="checkPassword()">Ingresar al Sistema</button>
    </div>

    <!-- PANEL PRINCIPAL -->
    <div id="main-panel" class="hidden">
        <h1>Centro de Control</h1>

        <!-- FORMULARIO DE REGISTRO -->
        <div class="card">
            <h2>Nuevo Registro de Operación</h2>
            <form id="record-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Fecha de Operación</label>
                        <input type="date" id="fecha" required>
                    </div>
                    <div class="form-group">
                        <label>Nombre del Operador/Cliente</label>
                        <input type="text" id="nombre" placeholder="Ej: Juan Pérez" required>
                    </div>
                    <div class="form-group">
                        <label>Pagos Ingresados ($)</label>
                        <input type="number" id="pagos" class="input-money" step="0.01" placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label>Fichas Entregadas ($)</label>
                        <input type="number" id="fichas" class="input-money" step="0.01" placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label>Respaldo en Caja ($)</label>
                        <input type="number" id="respaldo" class="input-money" step="0.01" placeholder="0.00">
                    </div>
                </div>
                <div class="form-group" style="margin-top: 20px;">
                    <label>Observaciones y Notas Finales</label>
                    <textarea id="observaciones" rows="3" placeholder="Detalles relevantes de la operación..."></textarea>
                </div>
                <button type="submit" class="btn-primary">Finalizar y Guardar Registro</button>
            </form>
        </div>

        <!-- RESUMEN DE DATOS -->
        <div class="card">
            <h2>Historial de Operaciones Recientes</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Nombre</th>
                            <th style="text-align: right;">Pagos ($)</th>
                            <th style="text-align: right;">Fichas ($)</th>
                            <th style="text-align: right;">Respaldo ($)</th>
                            <th>Observaciones</th>
                        </tr>
                    </thead>
                    <tbody id="records-table">
                        <!-- Las filas se agregan dinámicamente -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<script>
    // Configuración
    const PIN_CORRECTO = "1234"; // Mantenemos el mismo PIN
    const STORAGE_KEY = 'casino_records_pro'; // Clave nueva para no mezclar datos si usas el mismo navegador

    // Cargar fecha de hoy automáticamente
    document.getElementById('fecha').valueAsDate = new Date();

    // Gestión del PIN
    function checkPassword() {
        const pass = document.getElementById('password-input').value;
        const errorMsg = document.getElementById('login-error');

        if (pass === PIN_CORRECTO) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-panel').classList.remove('hidden');
            errorMsg.classList.add('hidden');
            loadRecords(); // Carga la tabla al entrar
        } else {
            errorMsg.classList.remove('hidden');
            document.getElementById('password-input').value = '';
            document.getElementById('password-input').focus();
        }
    }

    // Permitir Enter en el input de PIN
    document.getElementById('password-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') { checkPassword(); }
    });


    // --- LÓGICA DE DATOS (LocalStorage) ---

    // Formateador de moneda profesional
    const formatter = new Intl.NumberFormat('es-AR', {
        style: 'currency',
        currency: 'ARS',
        minimumFractionDigits: 2
    });

    // Guardar nuevo registro
    document.getElementById('record-form').addEventListener('submit', function(e) {
        e.preventDefault();

        const record = {
            id: Date.now(), // ID único para cada registro
            fecha: document.getElementById('fecha').value,
            nombre: document.getElementById('nombre').value,
            pagos: parseFloat(document.getElementById('pagos').value) || 0,
            fichas: parseFloat(document.getElementById('fichas').value) || 0,
            respaldo: parseFloat(document.getElementById('respaldo').value) || 0,
            observaciones: document.getElementById('observaciones').value || '-'
        };

        let records = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        records.unshift(record); // Agrega al principio de la lista
        localStorage.setItem(STORAGE_KEY, JSON.stringify(records));

        this.reset(); // Limpia formulario
        document.getElementById('fecha').valueAsDate = new Date(); // Resetea fecha a hoy
        loadRecords(); // Recarga la tabla
    });

    // Cargar y dibujar tabla
    function loadRecords() {
        const tbody = document.getElementById('records-table');
        tbody.innerHTML = '';
        const records = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

        if (records.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 30px;">No hay registros guardados aún.</td></tr>';
            return;
        }

        records.forEach(r => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td class="col-fecha">${formatearFecha(r.fecha)}</td>
                <td class="col-nombre">${r.nombre}</td>
                <td class="col-money">${formatter.format(r.pagos)}</td>
                <td class="col-money">${formatter.format(r.fichas)}</td>
                <td class="col-money">${formatter.format(r.respaldo)}</td>
                <td class="col-obs">${r.observaciones}</td>
            `;
            tbody.appendChild(row);
        });
    }

    // Ayudante para formatear fecha (AAAA-MM-DD a DD/MM/AAAA)
    function formatearFecha(fechaStr) {
        if(!fechaStr) return '-';
        const [yy, mm, dd] = fechaStr.split('-');
        return `${dd}/${mm}/${yy}`;
    }
</script>

</body>
</html>
